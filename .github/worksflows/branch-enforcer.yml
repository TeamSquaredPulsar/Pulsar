name: 'Enforce Branch Merge Rules'

on:
    pull_request:
        branches:
            - main

jobs:
    check_source_branch:
        runs-on: ubuntu-latest
        steps:
            -   name: Check branch
                # This checks if the target is main, but the source branch is NOT dev
                if: github.base_ref == 'main' && github.head_ref != 'dev'
                run: |
                    echo "ERROR: You can only merge into main from the 'dev' branch."
                    exit 1